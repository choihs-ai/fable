# pivot 브랜치를 GitHub Pages 에 배포한다(main 은 건드리지 않는다).
# 빌드 단계는 없다: 테스트(node --test)를 통과하면 저장소를 그대로 올린다.
# 처음 한 번은 저장소 설정이 필요할 수 있다: Settings → Pages → Source 를 "GitHub Actions" 로,
# Settings → Environments → github-pages 의 배포 허용 브랜치에 pivot 을 넣는다.
name: Pages

on:
  push:
    branches: [pivot]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-tests.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
